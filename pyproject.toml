[project]
name = "nfl-draft-classifier"
version = "0.1.0"
description = "NFL Draft prediction competition project"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "lightgbm>=4.6",
    "xgboost>=3.2",
    "catboost>=1.2",
]

[tool.setuptools.packages.find]
where = ["src"]
